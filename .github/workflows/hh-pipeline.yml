name: HH Pipeline

on:
  schedule:
    # Three times a day, MSK (UTC+3). Avoid minute :00 — GitHub often delays/drops scheduled runs at the top of the hour.
    - cron: "17 5 * * *" # 08:17 MSK
    - cron: "17 10 * * *" # 13:17 MSK
    - cron: "17 15 * * *" # 18:17 MSK
  workflow_dispatch:

concurrency:
  group: hh-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hh-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HH_AUTH_STATE_B64: ${{ secrets.HH_AUTH_STATE_B64 }}
      HH_AUTH_META_B64: ${{ secrets.HH_AUTH_META_B64 }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      RANK_LIMIT: "100"
      APPLY_MAX_PER_RUN: "30"
      HEADLESS: "true"
      CI: "true"
      RETENTION_INLINE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          echo "[job-assistant] operation=typecheck start"
          npx tsc --noEmit
          echo "[job-assistant] operation=typecheck done"

      - name: Verify database connection
        run: npm run db:check

      - name: Install Playwright Chromium
        run: |
          echo "[job-assistant] operation=playwright:install start"
          npx playwright install --with-deps chromium
          echo "[job-assistant] operation=playwright:install done"

      - name: Restore and verify HH session
        run: npm run hh:auth:check

      - name: Scrape vacancies
        run: npm run hh:scrape

      - name: Rank vacancies (DeepSeek)
        run: npm run ai:rank

      - name: Apply to vacancies
        run: npm run hh:apply

      - name: Retention cleanup
        if: success() || failure()
        run: npm run db:cleanup
